[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "emailhandler"
version = "2.0.0"
description = "轻量级邮件认证框架"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EmailHandler Team", email = "support@example.com"}
]
keywords = ["email", "verification", "authentication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31.0",
    "flask>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/emailhandler"
Documentation = "https://github.com/yourusername/emailhandler"
Repository = "https://github.com/yourusername/emailhandler.git"
Issues = "https://github.com/yourusername/emailhandler/issues"

[tool.setuptools]
packages = ["emailhandler"]
